<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Online Buzzer - Join</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="center-page">
    <div class="card">
      <h1>🔔 Online Buzzer</h1>
      <p class="subtitle">Enter the room code and your name to join.</p>
      <form id="joinForm">
        <input id="codeInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="6-digit room code" autocomplete="off" required />
        <input id="nameInput" type="text" maxlength="24" placeholder="Your name" autocomplete="off" required />
        <button type="submit">Join as Player</button>
      </form>
      <p id="error" class="error"></p>
      <hr />
      <p class="subtitle">Running the game?</p>
      <a class="host-link" href="host.html">Open Host Dashboard →</a>
    </div>
  </main>
  <script>
    const form = document.getElementById('joinForm');
    const codeInput = document.getElementById('codeInput');
    const nameInput = document.getElementById('nameInput');
    const error = document.getElementById('error');
    const cachedName = sessionStorage.getItem('buzzer_name');
    if (cachedName) nameInput.value = cachedName;
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      const code = codeInput.value.trim();
      if (!name) {
        error.textContent = 'Please enter a name.';
        return;
      }
      if (!/^\d{6}$/.test(code)) {
        error.textContent = 'Room code must be 6 digits.';
        return;
      }
      sessionStorage.setItem('buzzer_name', name);
      sessionStorage.setItem('buzzer_code', code);
      window.location.href = 'buzzer.html';
    });
  </script>
</body>
</html>
